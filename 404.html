<!DOCTYPE html>
<html>
  <head>
    <meta charset="UTF-8" />

    <script>
      // Guarda a rota que o usuário tentou acessar
      sessionStorage.setItem(
        "redirectPath",
        window.location.pathname +
        window.location.search +
        window.location.hash
      );

      // Volta para a aplicação React
      window.location.replace("/");
    </script>
  </head>

  <body></body>
</html>
